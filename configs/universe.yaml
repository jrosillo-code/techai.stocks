# Rules-based theme baskets (tickers must exist in `securities`).
# Delisted names stay in their thematic basket for the years they traded — the
# investable mask handles listing windows, so a basket is a *definition*, not a
# claim that every member was tradeable on every date.
# NOTE: "ON" (ON Semiconductor) is QUOTED everywhere it appears. Unquoted, YAML
# 1.1 resolves ON/OFF/YES/NO to booleans, so the ticker silently became `True`
# and every downstream panel keyed on it broke. Any future ticker that collides
# with a YAML keyword needs the same treatment.
baskets:
  ai_compute:      [NVDA, AMD, AVGO, TSM, ARM, MRVL, ALAB, CRDO, GFS]
  semiconductors:  [NVDA, AMD, AVGO, TSM, MU, MRVL, INTC, QCOM, TXN, ADI, NXPI,
                    "ON", MCHP, SWKS, QRVO, MPWR, WOLF, GFS, ALAB, CRDO, ARM,
                    XLNX, MXIM, ALTR, BRCM, ATML, LSI, FCS, IDTI, CY]
  semi_equipment:  [ASML, AMAT, LRCX, KLAC, TER, ENTG]
  eda_tools:       [SNPS, CDNS, ANSS, MENT]
  cloud_platforms: [MSFT, GOOGL, AMZN, ORCL, SNOW, IBM, NET, DDOG, MDB]
  enterprise_ai:   [MSFT, CRM, NOW, PLTR, SNOW, ADBE, ORCL, INTU, WDAY, TEAM,
                    DDOG, MDB, PATH, IOT, VMW, SPLK, RHT, CA, CTXS, ZEN, NUAN]
  cybersecurity:   [CRWD, PANW, FTNT, ZS, OKTA, CYBR, S, FEYE, PFPT, MFE]
  networking:      [CSCO, ANET, KEYS, JNPR, BRCD, TLAB, NT, WCOM, LU, JDSU]
  dc_infrastructure: [ANET, SMCI, DELL, VRT, HPE, NTAP, PSTG, WDC, CSCO]
  robotics:        [ISRG, ROK, SYM, TER, PATH]
  ai_power:        [CEG, VST, NRG, GEV, PWR]
  internet_platforms: [GOOGL, AMZN, META, NFLX, SHOP, UBER, ABNB, APP, TTD,
                       YHOO, TWTR, LNKD]
  megacap_ai:      [NVDA, MSFT, GOOGL, AMZN, META, AAPL, AVGO, TSLA]
  # The full live-and-dead technology cross-section. Cross-sectional strategies
  # run over this when no basket is named; it is listed explicitly so the
  # membership is auditable rather than implicit.
  ai_broad:        [NVDA, AMD, AVGO, TSM, ARM, MU, MRVL, INTC, QCOM, TXN, ADI,
                    NXPI, "ON", MCHP, SWKS, QRVO, MPWR, GFS, WOLF, ALAB, CRDO,
                    ASML, AMAT, LRCX, KLAC, TER, ENTG, SNPS, CDNS,
                    MSFT, GOOGL, AMZN, META, AAPL, TSLA, ORCL, IBM, NFLX,
                    CRM, ADBE, NOW, SNOW, PLTR, INTU, WDAY, DDOG, MDB, NET,
                    TEAM, PATH, IOT, SHOP, UBER, ABNB, APP, TTD,
                    CRWD, PANW, FTNT, ZS, OKTA, CYBR, S,
                    CSCO, ANET, KEYS, SMCI, DELL, HPE, NTAP, PSTG, WDC, VRT,
                    ISRG, ROK, SYM, CEG, VST, NRG, GEV, PWR]
  # Shortlist of companies the user is likely to own — the §"buy it or trade
  # it" portfolio comparisons run over this basket.
  target_holdings: [NVDA, MSFT, GOOGL, AMZN, META, AVGO, AMD, TSM, ASML, ARM,
                    PLTR, ORCL, CRWD, PANW, ANET, MU, VRT, CEG]
