# Point-in-time universe definition for the US technology / AI research universe.
#
# Every security carries listing metadata so backtests only see names that were
# actually investable on a given date. `ipo` is the first US-listing date
# (month precision is acceptable; the universe builder is conservative and only
# admits a name after this date plus `seasoning_days`). `delisted` marks the
# last trading date for names that left the market; the backtester liquidates
# at the delisting price. Never remove delisted names from this file — that is
# how survivorship bias creeps in.
#
# Names listed before 1990-01-02 carry `ipo: 1990-01-02`, the first date the
# data layer covers. That is a floor, not a claim about the actual listing
# date, and it is conservative: it can only delay a name's entry, never
# advance it.
#
# EXPANSION (freeze v3, 2026-08-05) — the roster grew from 38 securities to 120
# for two reasons:
#   1. Breadth. 33 live names could not distinguish "this strategy picks good
#      technology companies" from "this strategy holds NVDA". An 81-name live
#      universe spanning semiconductors, EDA, software, internet, cybersecurity,
#      networking, robotics and AI-adjacent power gives cross-sectional
#      strategies something to actually select from.
#   2. Survivorship bias. The single largest known weakness of the study was a
#      thin delisted roster (5 names). It is now 39, covering the dot-com
#      casualties (Nortel, WorldCom, Silicon Graphics, JDS Uniphase), the
#      acquisition wave (Altera, Broadcom Corp, Red Hat, VMware, Activision,
#      Splunk, Ansys, Juniper) and the take-privates (Citrix, Zendesk,
#      Proofpoint, Twitter). Any strategy that looks good only because the
#      losers were never in the sample should now show it.
#
# NOTE ON REAL DATA: free providers frequently do NOT serve history for
# delisted tickers. The quality gate records per-name coverage, and the loader
# refuses to silently substitute. A real run with missing delisted history is
# reported as survivorship-limited rather than presented as clean.

settings:
  min_price: 3.0                # exclude sub-$3 names at rebalance time
  min_median_dollar_volume: 5e6 # 63-day median dollar volume floor
  seasoning_days: 126           # no trading until ~6 months of history exists
  max_names: 120

