# Rules-based theme baskets (tickers must exist in `securities`).
baskets:
  ai_compute:      [NVDA, AMD, AVGO, TSM, ARM, MRVL]
  semiconductors:  [NVDA, AMD, AVGO, TSM, ASML, MU, MRVL, INTC, QCOM, AMAT, LRCX, XLNX, MXIM]
  cloud_platforms: [MSFT, GOOGL, AMZN, ORCL, SNOW]
  enterprise_ai:   [MSFT, CRM, NOW, PLTR, SNOW, ADBE, ORCL]
  cybersecurity:   [CRWD, PANW, FTNT]
  dc_infrastructure: [ANET, SMCI, DELL, VRT, CEG, VST]
  megacap_ai:      [NVDA, MSFT, GOOGL, AMZN, META, AAPL, AVGO, TSLA]
  # Shortlist of companies the user is likely to own — the §"buy it or trade
  # it" portfolio comparisons run over this basket.
  target_holdings: [NVDA, MSFT, GOOGL, AMZN, META, AVGO, AMD, TSM, ASML, ARM,
                    PLTR, ORCL, CRWD, PANW, ANET, MU, VRT, CEG]
