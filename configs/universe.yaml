# Point-in-time universe definition for the US technology / AI research universe.
#
# Every security carries listing metadata so backtests only see names that were
# actually investable on a given date. `ipo` is the first US-listing date
# (month precision is acceptable; the universe builder is conservative and only
# admits a name after this date plus `seasoning_days`). `delisted` marks the
# last trading date for names that left the market; the backtester liquidates
# at the delisting price. Never remove delisted names from this file — that is
# how survivorship bias creeps in.

settings:
  min_price: 3.0                # exclude sub-$3 names at rebalance time
  min_median_dollar_volume: 5e6 # 63-day median dollar volume floor
  seasoning_days: 126           # no trading until ~6 months of history exists
  max_names: 60

securities:
  # ---- AI compute & semiconductors ----
  - {ticker: NVDA, name: NVIDIA,                 sector: semiconductors,   ipo: 1999-01-22}
  - {ticker: AMD,  name: Advanced Micro Devices, sector: semiconductors,   ipo: 1979-10-15}
  - {ticker: AVGO, name: Broadcom,               sector: semiconductors,   ipo: 2009-08-06}
  - {ticker: TSM,  name: Taiwan Semiconductor ADR, sector: semiconductors, ipo: 1997-10-08}
  - {ticker: ASML, name: ASML ADR,               sector: semi_equipment,   ipo: 1995-03-15}
  - {ticker: ARM,  name: Arm Holdings ADR,       sector: semiconductors,   ipo: 2023-09-14}
