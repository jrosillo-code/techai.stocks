# Strategy genealogy: versioned history per research line.
# Every node records what changed, why, and whether the change required a
# freeze version bump. History is append-only — rejected versions stay.

lines:
  momentum_cross_sectional:
    title: "Cross-sectional momentum"
    versions:
      - {id: xsmom_v1, strategy: XSMomentumTopN,
         date: 2026-08-04, freeze: pre-v1,
         change: "initial grid: lookback {63,126,252} × top_n {3,5,8} × weighting {equal, inverse_vol, momentum}",
         why: "textbook relative-strength hypothesis", outcome: "shakedown run"}
      - {id: xsmom_v2, strategy: XSMomentumTopN,
         date: 2026-08-04, freeze: v1,
         change: "momentum-weighting variant deprecated",
         why: "concentrated ~all P&L in the single hottest name (top_name_share ≈ 1)",
         outcome: "deprecated variant retained in registry", requires_freeze_bump: false}
      - {id: xsmom_v3, strategy: XSMomentumTopN,
         date: 2026-08-04, freeze: v2,
         change: "re-frozen under audited metrics (AUD-006 CAGR fix); target_holdings basket variants added",
         why: "audit remediation + shortlist comparisons",
         outcome: "active core", requires_freeze_bump: true}

  mean_reversion:
    title: "Short-horizon mean reversion"
    versions:
      - {id: meanrev_v1, strategy: RSIReversion,
         date: 2026-08-04, freeze: pre-v1,
         change: "RSI(2) entry {5,10,15}, Bollinger reversion, 5/10-day reversal",
         why: "liquidity-provision hypothesis", outcome: "shakedown run"}
      - {id: meanrev_v2, strategy: RSIReversion,
         date: 2026-08-04, freeze: v1,
         change: "entry=15 and BollingerReversion deprecated",
         why: "entry=15 duplicated entry=10 with worse net Sharpe; Bollinger mechanically duplicates RSI trigger; all variants cost-fragile (zero-cost Sharpe 0.85 → stressed −0.30)",
         outcome: "kept as exploratory falsification targets", requires_freeze_bump: false}

  breakout:
    title: "Breakout / volatility expansion"
    versions:
      - {id: breakout_v1, strategy: DonchianBreakout,
         date: 2026-08-04, freeze: pre-v1,
         change: "Donchian {20,55,100} with and without regime filter",
         why: "trend-initiation hypothesis", outcome: "shakedown run"}
      - {id: breakout_v2, strategy: DonchianBreakout,
         date: 2026-08-04, freeze: v1,
         change: "unfiltered variants deprecated",
         why: "whipsawed through bear markets; dominated by regime-filtered twin at every window",
         outcome: "regime-filtered variants promoted to core", requires_freeze_bump: false}

  risk_managed:
    title: "Risk-managed exposure"
    versions:
      - {id: rm_v1, strategy: VolTargetedBasket,
         date: 2026-08-04, freeze: pre-v1,
         change: "vol targeting {15,20,25}%, drawdown de-risk, inverse-vol basket",
         why: "constant-risk compounding hypothesis", outcome: "strongest family in shakedown"}
      - {id: rm_v2, strategy: VolTargetedBasket,
         date: 2026-08-04, freeze: v1,
         change: "grid widened: vol_window {21,63}, rebalance {W-FRI, ME}, dd_full {−30,−40}%",
         why: "family flagged for deeper study; axes per §14 kept coarse",
         outcome: "expanded core", requires_freeze_bump: true}
      - {id: rm_v3, strategy: TrendPlusVolTarget,
         date: 2026-08-04, freeze: v1,
         change: "NEW combined overlay: QQQ trend gate with hysteresis × vol targeting",
         why: "trend removes the left tail, vol targeting smooths the path — complementary failure modes",
         outcome: "top-ranked in synthetic demos (labeled demonstration only)",
         requires_freeze_bump: true}
      - {id: rm_v4, strategy: TrendPlusVolTarget,
         date: 2026-08-04, freeze: v2,
         change: "re-frozen under audited metrics + engine invariant hooks",
         why: "audit remediation (AUD-006, AUD-011)",
         outcome: "active core awaiting first real study", requires_freeze_bump: true}

  platform_metrics:
    title: "(cross-cutting) metric definitions"
    versions:
      - {id: metrics_v1, strategy: "-", date: 2026-08-04, freeze: v1,
         change: "CAGR = growth^(252/len)−1", why: "initial implementation",
         outcome: "superseded"}
      - {id: metrics_v2, strategy: "-", date: 2026-08-04, freeze: v2,
         change: "CAGR over elapsed calendar time (audit AUD-006)",
         why: "row-count/252 understated CAGR ~35bp/yr on business-day calendars",
         outcome: "all demo artifacts regenerated", requires_freeze_bump: true}

  universe_definition:
    title: "(cross-cutting) what the study is allowed to hold"
    versions:
      - {id: univ_v1, strategy: "-", date: 2026-08-04, freeze: v1,
         change: "38 securities: 33 live tech names + 5 delisted (SUNW, EMC, YHOO, MXIM, XLNX)",
         why: "initial roster covering the AI/tech themes the study was commissioned to examine",
         outcome: "superseded"}
      - id: univ_v2
        strategy: "-"
        date: 2026-08-05
        freeze: v3
        change: "120 securities: 81 live + 39 delisted; 14 benchmark funds; 15 theme baskets"
        why: >-
          Two v2 findings forced it. First, 33 live names could not distinguish a
          strategy that picks good technology companies from one that holds NVDA
          — a top-5 screen over 33 names is barely a screen. Second, a 5-name
          delisted roster left survivorship bias as the largest known weakness in
          the study; it is now 39 names covering the dot-com bankruptcies, the
          acquisition wave and the take-privates.
        outcome: "active; every v2 result re-run against it, and the v2 cohort excluded from all comparisons"
        requires_freeze_bump: true

  residual_and_factor:
    title: "Diversifying factors"
    versions:
      - id: factor_v1
        strategy: ResidualMomentum
        date: 2026-08-05
        freeze: v3
        change: "NEW family: residual momentum, multi-horizon consensus, low-volatility tech, breadth gating, theme rotation, fundamental acceleration"
        why: >-
          The clearest result of the v2 study was negative: across 24 families
          the pairwise correlation of monthly returns was mostly above 0.85 and
          everything fell together in 2022. They were one bet wearing 24 hats.
          This family exists to test whether ANYTHING in US technology behaves
          differently — residual momentum strips the shared factor out before
          ranking, breadth gating uses participation rather than index price,
          and theme rotation selects one level above the stock.
        outcome: "awaiting first evaluation"
        requires_freeze_bump: true

  allocation_schemes:
    title: "Weighting without forecasting"
    versions:
      - {id: alloc_v1, strategy: InverseVolBasket,
         date: 2026-08-04, freeze: v1,
         change: "inverse-volatility weighting of a fixed basket",
         why: "risk-balanced weights avoid concentration in the wildest name",
         outcome: "beat equal weight on Sharpe in the v2 synthetic shakedown"}
      - id: alloc_v2
        strategy: EqualRiskContribution
        date: 2026-08-05
        freeze: v3
        change: "NEW: equal-risk-contribution weighting, and a minimum-correlation sleeve"
        why: >-
          Inverse-vol is equal-risk-contribution under the assumption that
          everything is equally correlated, which is badly wrong here — semis
          move together far more tightly than semis and software. With 33 names
          the difference was not measurable; with 120 it should be. The
          minimum-correlation sleeve is the direct test of whether a
          less-redundant corner of technology exists at all.
        outcome: "awaiting first evaluation"
        requires_freeze_bump: true
