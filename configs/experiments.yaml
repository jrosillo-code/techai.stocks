# Experiment grid. Every variant runs under every cost scenario and lands in
# the registry — including failures. Grids stay coarse on purpose: fine grids
# inflate the trial count the deflated Sharpe ratio must correct for.
#
# Governance fields (§experiment-budget discipline):
#   status: core         economically defensible, kept in the headline suite
#           exploratory  hypothesis worth testing, more scrutiny before trust
#           deprecated   NOT RUN — recorded in the registry with the reason
#   reason: required for deprecated entries
#   hypothesis: stated before results are seen; runner stores it verbatim
#
# Reassessment after the synthetic shakedown (2026-08): mean-reversion variants
# were uniformly cost-fragile (zero-cost Sharpe evaporated at base costs);
# unfiltered breakouts were dominated by their regime-filtered twins; the
# momentum-weighted XS variant concentrates in a single winner. Those are
# deprecated below with reasons rather than silently dropped.
#
# FREEZE v3 (2026-08-05). Two changes, both driven by v2's findings rather than
# by a search for better numbers:
#
#   1. The universe went from 38 securities to 120 (81 live, 39 delisted). Every
#      pre-existing variant is re-run against it. Their v2 numbers are NOT
#      comparable and are not shown beside the new ones — the ranking filters to
#      one universe cohort, which is why the run count restarts rather than
#      accumulating.
#   2. Two new families were added, `factor` and `allocation`. They exist to
#      test v2's central negative result: that ~every strategy in the study was
#      a variation on one bet, holding the same megacaps and falling together.
#      Each new entry names the specific failure it attacks.
#
# The trial count rises with these additions and the deflated Sharpe ratio
# corrects for it. Grids remain coarse deliberately — a fine grid buys a higher
# peak backtest and a worse correction, which is a bad trade.

benchmarks:
  - {class: BuyAndHold, status: core, grid: {ticker: [SPY, QQQ, XLK, SOXX, SMH, IGV]}}
  # Broader passive alternatives added with the v3 benchmark expansion: a
  # total-tech fund, small caps, a speculative-innovation fund, and the
  # cloud/cyber/robotics theme funds an investor would realistically compare
  # against instead of building any of this.
  - {class: BuyAndHold, status: core, grid: {ticker: [VGT, IWM, ARKK, SKYY, CIBR, BOTZ]}}
  - {class: EqualWeightUniverse, status: core, grid: {rebalance: [ME]}}
  - {class: EqualWeightUniverse, status: core, grid: {rebalance: [ME], basket: [megacap_ai, ai_compute]}}
  - {class: EqualWeightUniverse, status: core,
     hypothesis: "Equal-weighting the whole live cross-section is the honest passive baseline for any stock-picking claim",
     grid: {rebalance: [ME, QE], basket: [ai_broad]}}
  - {class: CapWeightUniverse, status: core, grid: {rebalance: [QE], basket: [null, megacap_ai, ai_broad]}}
  - {class: QQQMovingAverage, status: core, grid: {window: [200], fallback: [IEF, null]}}
  - {class: SimpleMomentum12_1, status: core, grid: {top_n: [5]}}

buy_and_hold_companies:
  - {class: BuyAndHold, status: core,
     grid: {ticker: [NVDA, MSFT, GOOGL, AMZN, META, AAPL, AVGO, AMD, TSM, ASML,
                     ARM, PLTR, ORCL, CRM, ADBE, NOW, SNOW, CRWD, PANW, ANET,
                     SMCI, MU, MRVL, DELL, VRT, CEG, VST, TSLA]}}
  # Reference points, not strategies: single-name buy & hold is excluded from
  # the benchmark hurdle because picking the one winner in hindsight is not an
  # alternative anyone could have chosen in advance. Added in v3 so the
  # company-level comparison covers the wider roster — including names that
  # went to zero and names that were acquired.
  - {class: BuyAndHold, status: core,
     grid: {ticker: [TXN, ADI, KLAC, SNPS, CDNS, IBM, NFLX, INTU, CSCO, ISRG,
                     UBER, SHOP, APP, TTD, DDOG, NET, ZS, OKTA, WDAY, NXPI,
                     MPWR, GEV, NRG, PWR, HPE, WDC, INTC, QCOM]}}
  - {class: BuyAndHold, status: core,
     hypothesis: "Holding the losers is the point: these are the outcomes a survivorship-biased sample never shows",
     grid: {ticker: [NT, WCOM, SGI, JDSU, SUNW, LU, PALM, YHOO, VMW, RHT,
                     ATVI, SPLK, TWTR, JNPR, CTXS, XLNX, ALTR, BRCM]}}

tsmom:
  - {class: TrendFollowCash, status: core,
     hypothesis: "Per-name absolute trend cuts the deep tech drawdowns for a CAGR toll",
     grid: {sma_window: [100, 150, 200, 250], fallback: [IEF]}}
  - {class: TrendFollowCash, status: core,
     grid: {sma_window: [200], fallback: [BIL], basket: [megacap_ai]}}
  - {class: AbsoluteMomentum, status: exploratory,
     grid: {lookback_days: [126, 252], fallback: [BIL]}}
  - {class: DualMomentum, status: exploratory,
     grid: {lookback_days: [63, 126, 252]}}

xsmom:
  - {class: XSMomentumTopN, status: core,
     hypothesis: "Relative strength persists among tech leaders",
     grid: {lookback_days: [63, 126, 252], top_n: [3, 5, 8], weighting: [equal]}}
  # v3: the same idea given a real cross-section to choose from. With 33 names
  # a "top 5" screen was picking from a shortlist that was already the answer;
  # with 81 live names it has to actually select.
  - {class: XSMomentumTopN, status: core,
     hypothesis: "Given a wide cross-section, relative-strength selection adds value over equal-weighting the same universe",
     grid: {basket: [ai_broad], lookback_days: [126, 252], top_n: [10, 20], weighting: [equal]}}
  - {class: XSMomentumTopN, status: exploratory,
     grid: {lookback_days: [126], top_n: [5], weighting: [inverse_vol]}}
  - {class: XSMomentumTopN, status: deprecated,
     reason: "momentum-weighting concentrated ~all P&L in the single hottest name (top_name_share ≈ 1); rank information is already in selection",
     grid: {lookback_days: [126], top_n: [5], weighting: [momentum]}}
  - {class: XSRiskAdjMomentum, status: exploratory,
     grid: {lookback_days: [126, 252], top_n: [5]}}
  - {class: RelativeStrengthVsBench, status: exploratory,
     grid: {lookback_days: [126], top_n: [5, 8]}}

meanrev:
  # Kept as exploratory falsification targets: the hypothesis is that these
  # FAIL after realistic costs; judge them under the stressed scenario.
  - {class: RSIReversion, status: exploratory,
     hypothesis: "Oversold snapback exceeds round-trip costs (expected: no)",
     grid: {entry: [5, 10], exit: [60]}}
  - {class: ShortTermReversal, status: exploratory,
     grid: {lookback_days: [5], top_n: [5]}}
  - {class: RSIReversion, status: deprecated,
     reason: "entry=15 duplicates entry=10 with more trades and worse net Sharpe in shakedown",
     grid: {entry: [15], exit: [60]}}
  - {class: BollingerReversion, status: deprecated,
     reason: "mechanically duplicates RSI reversion (same oversold-in-uptrend trigger); cost-fragile in shakedown",
     grid: {entry_z: [-2.0, -2.5]}}

breakout:
  - {class: DonchianBreakout, status: core,
     hypothesis: "Multi-month highs with a risk-on regime filter precede continuation",
     grid: {entry_window: [20, 55, 100], exit_window: [20], regime_filter: [true]}}
  - {class: DonchianBreakout, status: deprecated,
     reason: "unfiltered variant whipsawed through bear markets and was dominated by the regime-filtered twin at every entry window",
     grid: {entry_window: [20, 55, 100], exit_window: [20], regime_filter: [false]}}
  - {class: VolCompressionBreakout, status: exploratory,
     grid: {entry_window: [40], squeeze_pct: [0.2, 0.3]}}

fundamental:
  # Real mode: runs only when point-in-time fundamentals pass the quality gate.
  - {class: QualityGrowth, status: core,
     hypothesis: "Compounding fundamentals precede compounding prices",
     grid: {top_n: [5, 8], rebalance: [QE]}}
  - {class: ValuationAwareGrowth, status: exploratory,
     grid: {top_n: [8], max_ps_own_pct: [0.7, 0.85, 1.0]}}

regime:
  # Real mode: excluded automatically when VIX (or macro vintages) are absent;
  # CPI/UNRATE flags use revised data — treat results as upper bounds.
  - {class: RegimeSwitchedTech, status: exploratory,
     grid: {cut: [0.2, 0.25, 0.34]}}
  - {class: SemisLeadership, status: exploratory,
     grid: {lookback_days: [63, 126]}}

riskmanaged:
  # Expanded after the synthetic shakedown flagged this family — grids widened
  # along the axes §14 calls for (vol window, target, rebalance cadence,
  # drawdown depth) while staying coarse.
  - {class: VolTargetedBasket, status: core,
     hypothesis: "Constant-risk sizing improves compounding vs constant-dollar",
     grid: {basket: [megacap_ai], target_vol: [0.15, 0.20, 0.25],
            vol_window: [21, 63], rebalance: [W-FRI, ME]}}
  - {class: DrawdownDeRisk, status: core,
     hypothesis: "Drawdowns cluster; scaling down into them cuts the left tail",
     grid: {basket: [megacap_ai], dd_start: [-0.10, -0.15], dd_full: [-0.30, -0.40]}}
  - {class: TrendPlusVolTarget, status: core,
     hypothesis: "Trend gates tail risk, vol targeting smooths the path — complementary overlays",
     grid: {basket: [megacap_ai], target_vol: [0.15, 0.20],
            trend_window: [150, 200], hysteresis: [0.0, 0.02]}}
  - {class: InverseVolBasket, status: core,
     grid: {basket: [megacap_ai, semiconductors, ai_broad]}}
  - {class: TrendFollowCash, status: core,
     hypothesis: "Per-name trend filtering matters more over a wide roster, where many names are in their own bear markets while the index rises",
     grid: {sma_window: [200], fallback: [IEF], basket: [ai_broad]}}

ml:
  - {class: MLRankStrategy, status: exploratory,
     hypothesis: "A shrunk linear feature blend ranks forward returns better than any single momentum feature",
     grid: {horizon: [21], top_n: [6], alpha: [10.0]}}

# ============================ NEW IN FREEZE v3 ==============================
# The v2 study's clearest result was uncomfortable: across 24 families, monthly
# return correlations were mostly above 0.85 and every strategy fell together
# in 2022. They were not 24 ideas, they were one idea wearing 24 hats. These
# two families exist to test whether ANYTHING in US technology behaves
# differently — not to raise the leaderboard.

factor:
  - {class: ResidualMomentum, status: core,
     hypothesis: "Ranking on benchmark-neutral residual return selects genuinely idiosyncratic winners and yields a portfolio less correlated with owning the sector outright",
     grid: {lookback_days: [126, 252], top_n: [8, 12], beta_window: [252]}}
  - {class: MultiHorizonMomentum, status: core,
     hypothesis: "Requiring agreement across 3/6/12-month horizons removes the lookback-selection degree of freedom and cuts whipsaw, at the cost of late entries",
     grid: {top_n: [5, 8, 12], min_agree: [3], weighting: [equal]}}
  - {class: MultiHorizonMomentum, status: exploratory,
     hypothesis: "Relaxing consensus to 2 of 3 trades earlier; expected to raise turnover more than return",
     grid: {top_n: [8], min_agree: [2], weighting: [equal, inverse_vol]}}
  - {class: LowVolatilityTech, status: core,
     hypothesis: "The low-volatility anomaly survives inside a high-beta sector: lower CAGR, higher Sharpe, shallower drawdown. A clean falsification target either way",
     grid: {top_n: [10, 20], vol_window: [126], trend_filter: [false, true]}}
  - {class: BreadthGatedBasket, status: core,
     hypothesis: "Deteriorating participation precedes index-level drawdowns, so a breadth gate exits earlier and whipsaws less than a price-trend gate on the index",
     grid: {basket: [megacap_ai, ai_broad], threshold: [0.40, 0.50]}}
  - {class: ThemeRotation, status: core,
     hypothesis: "Capital-spending cycles rotate between layers of the technology stack with enough persistence to trade, without the single-name concentration that penalises stock-level momentum",
     grid: {lookback_days: [126, 252], top_themes: [2, 3, 4]}}
  - {class: FundamentalAcceleration, status: exploratory,
     hypothesis: "Acceleration in published revenue growth precedes revaluation more reliably than the level of growth, which is already discounted",
     grid: {top_n: [8, 12], rebalance: [QE]}}

allocation:
  # Weighting schemes require no forecasting skill at all, which makes them the
  # cheapest possible source of improvement — and the easiest to over-credit.
  - {class: EqualRiskContribution, status: core,
     hypothesis: "Accounting for correlation as well as volatility beats inverse-vol weighting, which double-counts the risk of clustered names",
     grid: {basket: [megacap_ai, ai_broad, target_holdings], cov_window: [126, 252]}}
  - {class: MinCorrelationSleeve, status: core,
     hypothesis: "A sleeve chosen purely for low average correlation to the rest of the sector diversifies a core technology holding better than any return-driven selection; if it STILL tracks QQQ, the sector has no independent corner",
     grid: {top_n: [10, 15], corr_window: [252]}}

# §"Portfolio comparison for likely investments": every construction the user
# asked to compare, over the target_holdings shortlist, plus concentrated
# momentum-rotation variants (top 3/5/8).
target_holdings:
  - {class: EqualWeightUniverse, status: core, grid: {rebalance: [ME], basket: [target_holdings]}}
  - {class: CapWeightUniverse, status: core, grid: {rebalance: [QE], basket: [target_holdings]}}
  - {class: InverseVolBasket, status: core, grid: {basket: [target_holdings]}}
  - {class: TrendFollowCash, status: core,
     grid: {sma_window: [200], fallback: [IEF], basket: [target_holdings]}}
  - {class: VolTargetedBasket, status: core,
     grid: {basket: [target_holdings], target_vol: [0.20], vol_window: [63]}}
  - {class: TrendPlusVolTarget, status: core,
     grid: {basket: [target_holdings], target_vol: [0.20], trend_window: [200], hysteresis: [0.02]}}
  - {class: XSMomentumTopN, status: core,
     hypothesis: "Concentrated rotation among the shortlist beats holding all of it",
     grid: {basket: [target_holdings], lookback_days: [126], top_n: [3, 5, 8], weighting: [equal]}}

# ============================ NEW IN FREEZE v4 ==============================
# The first real study tested 208 variants and returned zero robust candidates,
# with almost everything correlating 0.7-0.9 to simply holding QQQ.
#
# That correlation was never a finding about technology stocks. Every one of
# those 208 variants was LONG-ONLY, and a portfolio permanently long the same
# market must co-move with it. The v3 families added to "find something that
# behaves differently" could not have succeeded, because the constraint causing
# the co-movement was never lifted. The engine has supported shorts and charged
# borrow since v1; nothing had used them.
#
# These are chosen from that structural gap, not from the leaderboard. Building
# what would have scored well on a holdout that has already been opened is
# fitting to an answer sheet, not research.
#
# COST, STATED PLAINLY: every entry below raises the trial count, and the
# deflated Sharpe ratio corrects across all trials ever run. These make the bar
# higher for themselves AND for the 208 that came before. The holdout has also
# been opened once already, so any result here is a SECOND look at it —
# development evidence, not out-of-sample evidence, however it is labelled.

longshort:
  # ONLY the genuinely hedged constructions. `family` is part of every
  # experiment's identity and groups the deflated-Sharpe trial batteries, so a
  # long-only screen filed here would corrupt both — and did, until it was
  # caught by the site claiming hedged strategies correlate 0.83 with the index
  # when the actual hedged ones correlate about zero.
  - {class: MarketNeutralMomentum, status: core,
     hypothesis: "The winner-minus-loser spread inside technology is a real return stream that survives borrow costs; being dollar-neutral removes the market exposure that made every long-only variant a repackaged index fund",
     grid: {lookback_days: [126, 252], top_n: [10, 15], gross: [1.0]}}
  - {class: BetaHedgedBasket, status: core,
     hypothesis: "Once the market component is hedged away, what remains in a megacap technology basket is either genuine selection value or nothing — this measures which",
     grid: {basket: [megacap_ai, target_holdings], beta_window: [126, 252]}}

quality:
  # Long-only company-quality screens, unlocked by the v4 EDGAR concept set
  # (gross profit, total assets, net income, R&D). These exist because the DATA
  # changed, not because the ideas are new. R&D intensity in particular is the
  # canonical technology-specific quality signal, and a study of technology
  # companies that could not measure it had a gap worth more than another
  # momentum variant.
  - {class: GrossProfitability, status: core,
     hypothesis: "Profitability predicts returns as strongly as growth and is close to independent of it, so it should select a materially different set of companies than the growth screens already tested",
     grid: {top_n: [8, 12], rebalance: [QE]}}
  - {class: ResearchIntensity, status: core,
     hypothesis: "Accounting expenses R&D immediately while its payoff is multi-year, so R&D-intensive technology companies report earnings that understate their economics — a documented, tech-specific mispricing the study could not previously measure",
     grid: {top_n: [10, 15], require_profitable: [false, true]}}
  - {class: AccrualQuality, status: exploratory,
     hypothesis: "Earnings backed by cash persist and earnings backed by accruals do not, and prices do not distinguish them; widely reported to have decayed since publication, so a null result is informative",
     grid: {top_n: [10, 15]}}
  - {class: PostEarningsDrift, status: exploratory,
     hypothesis: "Prices under-react to earnings news and drift for weeks; filing dates alone are sufficient to test this honestly at a 63-day hold, with no intraday timestamps required",
     grid: {hold_days: [42, 63], top_n: [10]}}

meta_timing:
  - {class: DispersionTimedSelection, status: exploratory,
     hypothesis: "The payoff to stock selection scales with cross-sectional dispersion, which is measurable in advance, so conditioning on it should keep the upside and drop the cost drag of low-dispersion regimes",
     grid: {lookback_days: [126], top_n: [8], disp_pct: [0.5, 0.6]}}
