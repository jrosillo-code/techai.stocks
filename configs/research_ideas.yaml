# Idea backlog — research ideas exist here BEFORE implementation.
# statuses: idea | planned | implementing | testing | auditing | accepted |
#           rejected | archived
# expected_edge / difficulty / capacity are coarse 1-5 ratings.

ideas:
  - id: IDEA-001
    title: Timestamped earnings-event dataset
    hypothesis: "Post-earnings-announcement drift and gap behavior are testable only with BMO/AMC-precision timestamps; conservative next-session execution otherwise destroys the signal."
    category: data
    expected_edge: 3
    required_data: "earnings announcement dates + timing (BMO/AMC), consensus estimates"
    difficulty: 3
    est_time: "1-2 weeks"
    expected_capacity: 4
    required_providers: ["paid: Wall Street Horizon / Zacks; partial: EDGAR 8-K acceptance times"]
    references: ["Bernard & Thomas (1989) PEAD"]
    status: planned
    notes: "Blocks the entire event-driven family (currently Tier C by design)."

  - id: IDEA-002
    title: Delisted-name price history
    hypothesis: "Cross-sectional results shift materially when failed firms are investable; current Tier B label can be upgraded to A only with delisting returns."
    category: data
    expected_edge: 4
    required_data: "full price history + delisting returns for the 39 delisted names in configs/universe.yaml"
    difficulty: 4
    est_time: "provider-dependent"
    expected_capacity: 5
    required_providers: ["CRSP", "Norgate", "EODHD"]
    references: ["Shumway (1997) delisting bias"]
    status: implementing
    notes: >-
      Half done as of freeze v3. The DEFINITION side is complete: the delisted
      roster went from 5 names to 39, covering the dot-com bankruptcies (NT,
      WCOM, SGI, JDSU, LU), the acquisition wave (ALTR, BRCM, RHT, VMW, ATVI,
      SPLK, ANSS, JNPR) and the take-privates (CTXS, ZEN, PFPT, TWTR), each with
      a security-master record and a successor. The DATA side is untouched:
      free providers generally serve no history for delisted tickers, so this
      still cannot be upgraded past Tier B without a paid source. Import path
      already exists (data/import/prices).

