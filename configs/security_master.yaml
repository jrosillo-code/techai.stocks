  # ================== ADDED WITH THE FREEZE-v3 EXPANSION ====================
  # Ticker traps that the expanded roster introduces. Each of these is a case
  # where naive symbol-keyed data assembly splices two unrelated companies or
  # loses one entirely.

  - sid: SEC_BRCM
    name: Broadcom Corporation (legacy)
    tickers: [{symbol: BRCM, from: 1998-04-17, to: 2016-02-01}]
    exchange: XNAS
    sector: semiconductors
    successor: {sid: SEC_AVGO, kind: acquisition, date: 2016-02-01}
    notes: >-
      THE trap in this universe. Avago acquired Broadcom Corp and took the
      Broadcom NAME, but AVGO's price history is Avago's, starting 2009. A
      vendor series labelled "Broadcom" therefore skips 1998-2009 entirely and
      shows none of the dot-com boom and bust this company actually lived
      through. BRCM and AVGO are separate securities here and are never joined.
