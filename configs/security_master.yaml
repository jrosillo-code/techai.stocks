# Canonical security master.
#
# `sid` is the permanent internal identifier — ticker text is NEVER a
# permanent key. `tickers` lists {symbol, from, to} history (to: null = still
# current). `successor` records what absorbed a delisted security. Provider
# symbol overrides live under `provider_symbols` (e.g. Stooq wants aapl.us —
# handled by the adapter — but class-share punctuation differs by vendor:
# BRK.B vs BRK-B style).
#
# Identifier fields (cusip/isin/figi) are optional and filled as sources
# provide them; absence is recorded as null rather than guessed.

