[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitb"
version = "0.1.0"
description = "AI & technology sector research and backtesting system"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "requests>=2.31",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "exchange_calendars>=4.5",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
live = ["yfinance>=0.2.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
